/* ---------- 日历(婚礼当月, 红圈标婚期) ---------- */
(function(){
  var y = WED.getFullYear(), m = WED.getMonth();
  var first = new Date(y, m, 1).getDay();          // 0=周日
  var days  = new Date(y, m+1, 0).getDate();
  var wrap = document.getElementById('calWrap');
  var html = '<div style="text-align:center;font-size:20.0px;letter-spacing:4px;color:#991700;margin-bottom:10px">'
           + y + ' 年 ' + (m+1) + ' 月</div>';
  var wd = ['日','一','二','三','四','五','六'];
  html += '<div style="display:flex;margin-bottom:6px">';
  for (var i=0;i<7;i++) html += '<div style="flex:1;text-align:center;font-size:18.0px;color:#C66">' + wd[i] + '</div>';
  html += '</div>';
  var cell = 74, ch = 66, n = 0;
  html += '<div style="display:flex;flex-wrap:wrap">';
  for (i=0;i<first;i++){ html += '<div style="width:'+cell+'px;height:'+ch+'px"></div>'; n++; }
  for (i=1;i<=days;i++){
    var cur = new Date(y,m,i);
    var isWed = (i === WED.getDate());
    var isToday = (cur.toDateString() === new Date().toDateString());
    var style = 'width:'+cell+'px;height:'+ch+'px;display:flex;align-items:center;justify-content:center;';
    if (isWed) {
      style += 'color:#fff;font-size:26.0px;font-weight:bold;';
    } else {
      style += 'color:#991700;font-size:25.0px;border-radius:50%;';
      if (isToday) style += 'box-shadow:inset 0 0 0 1.5px #C10909;';
    }
    html += '<div class="' + (isWed ? 'w3' : '') + '" style="' + style + '">' + i + '</div>';
    n++;
  }
  for (; n % 7 !== 0; n++) html += '<div style="width:'+cell+'px;height:'+ch+'px"></div>';
  html += '</div>';
  wrap.innerHTML = html;
})();

/* ---------- 倒计时(大+小) ---------- */
function cdBox(big){
  var size = big ? {w:86,h:96,num:34,unit:13,r:16} : {w:64,h:70,num:24,unit:10,r:12};
  var box = function(){
    var d = document.createElement('div');
    d.style.cssText = 'width:'+size.w+'px;height:'+size.h+'px;background:#C10909;border-radius:'+size.r+'px;'
      + 'display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff';
    var num = document.createElement('div'); num.style.cssText='font-size:'+size.num+'px;line-height:1.15;font-family:Georgia,serif;font-weight:600';
    var lab = document.createElement('div'); lab.style.cssText='font-size:'+size.unit+'px;line-height:1.2;opacity:.92;font-family:"Songti SC",serif;letter-spacing:1px';
    d.appendChild(num); d.appendChild(lab);
    return d;
  };
  var cells = {d:[box(),'天'],h:[box(),'时'],m:[box(),'分'],s:[box(),'秒']};
  var host = document.createElement('div'); host.style.display='flex'; host.style.gap = big?'10px':'7px';
  var nameMap = {d:'d',h:'h',m:'m',s:'s'};
  ['d','h','m','s'].forEach(function(k){ cells[k][0].lastChild.textContent = cells[k][1]; host.appendChild(cells[k][0]); });
  function pad2(n){return n<10?'0'+n:''+n}
  function tick(){
    var left = WED - Date.now();
    if (left <= 0){ ['d','h','m','s'].forEach(function(k){ cells[k][0].firstChild.textContent='00'; }); return; }
    var s = Math.floor(left/1000);
    cells.d[0].firstChild.textContent = pad2(Math.floor(s/86400));
    cells.h[0].firstChild.textContent = pad2(Math.floor(s%86400/3600));
    cells.m[0].firstChild.textContent = pad2(Math.floor(s%3600/60));
    cells.s[0].firstChild.textContent = pad2(s%60);
  }
  tick(); setInterval(tick, 1000);
  return host;
}

/* ---------- 页面缩放(750 设计稿 → 屏宽) ---------- */
var stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
function scaleStage(){
  var s = Math.min(1, window.innerWidth / 750);

/* ---------- 背景乐: 打开页面即自动播放(立即尝试+微信JSBridge+首触兜底), 右上角可暂停/恢复 ---------- */
var bgm = document.getElementById('bgm'), mBtn = document.getElementById('music'), played = false;
function tryPlay(){
  if (played) return;
  var p = bgm.play();
  if (p && p.then) p.then(function(){ played = true; mBtn.classList.add('on'); }).catch(function(){});
  else { played = true; mBtn.classList.add('on'); }   /* 旧内核同步返回 */
}
tryPlay();                                   /* 1) 立即尝试(部分安卓WebView/微信允许无手势播放) */
document.addEventListener('WeixinJSBridgeReady', tryPlay, false);  /* 2) 微信桥就绪后再试 */
['touchend','click'].forEach(function(ev){ document.addEventListener(ev, tryPlay, {passive:true}); });  /* 3) 首触兜底(iOS等严格策略) */
mBtn.addEventListener('click', function(){
  if (bgm.paused) { bgm.play(); mBtn.classList.add('on'); }
  else { bgm.pause(); mBtn.classList.remove('on'); }
});

/* 原版滚动入场动画驱动: 进入视口触发一次 */
(function(){
  var de = document.documentElement;
  de.classList.add('js');
  var els = document.querySelectorAll('.q');
  function fire(el, dly){
    el.classList.add('in');
    el.style.setProperty('--an', el.getAttribute('data-ani') || 'qFadeIn');
    el.style.setProperty('--dl', dly || el.getAttribute('data-dly') || '0s');
  }
  if(!('IntersectionObserver' in window)){ for(var k=0;k<els.length;k++) fire(els[k],'0s'); return; }
  var io = new IntersectionObserver(function(es){
    for(var i=0;i<es.length;i++) if(es[i].isIntersecting){ fire(es[i].target); io.unobserve(es[i].target); }
  }, {rootMargin:'0px 0px -6% 0px', threshold:0.04});
  for(var j=0;j<els.length;j++) io.observe(els[j]);
  /* 兜底: 仅补仍在视口内且未触发的(不提前播放下方未入场元素) */
  setTimeout(function(){
    for(var m=0;m<els.length;m++){
      if(els[m].classList.contains('in')) continue;
      var r = els[m].getBoundingClientRect();
      if(r.top < innerHeight && r.bottom > 0) fire(els[m],'0s');
    }
  }, 8000);
})();

/* 防微信字体放大 */
(function(){
  function fix(){ try{ WeixinJSBridge.invoke('setFontSizeCallback',{fontSize:0}); }catch(e){} }
  if (typeof WeixinJSBridge !== 'undefined') fix();
  document.addEventListener('WeixinJSBridgeReady', fix, false);
})();

/* 打开1.5s后自动上滑: 167px/s, 触屏/滚轮即停, 到底自动停 */
(function(){
  var started=false, stopped=false, timer=null;
  function halt(){ stopped=true; if(timer){clearInterval(timer); timer=null;} }
  document.addEventListener('touchstart',halt,{passive:true});
  document.addEventListener('wheel',halt,{passive:true});
  document.addEventListener('touchmove',halt,{passive:true});
  function begin(){
    if(started||stopped) return;
    started=true;
    timer=setInterval(function(){
      if(stopped||document.hidden) return;
      var max=document.body.scrollHeight-innerHeight;
      if(scrollY>=max-4){ halt(); return; }
      scrollBy(0,2);
    },12);
  }
  /* 第一张图(封面主照)1.5s入场完成时开始上滑 */ setTimeout(begin, 1500);
})();
